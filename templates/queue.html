<!DOCTYPE html>
<html>

<head>
    <title>Queue</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =====================================================
         NAVIGATION BAR
         ===================================================== -->

    <nav>

        <!-- SoundScape logo -->
        <a href="/" class="logo">
            <span class="sound">sound</span><span class="scape">SCAPE</span>
        </a>

        <!-- Main navigation links -->
        <div class="nav-links">
            <a href="/all_rankings">Ratings</a>
            <a href="/queue">Queue</a>
            <a href="/search">Search</a>
        </div>

    </nav>


    <!-- =====================================================
         MAIN PAGE CONTENT
         ===================================================== -->

    <div class="page-container">

        <!-- Queue page header -->
        <div class="queue-header">

            <h1>Queue</h1>

            <!-- Button that selects a random queued album -->
            <a
                href="{{ url_for('random_queue') }}"
                class="sort-button pick-random-button"
            >
                Pick Random
            </a>

        </div>


        <!-- =================================================
             QUEUED ALBUMS
             ================================================= -->

        {% if albums %}

            <!-- Album grid -->
            <div class="album-grid">

                {% for album in albums %}

                    <!-- Individual queued album -->
                    <div class="album-card">

                        <!--
                            If the album has already been reviewed,
                            clicking it opens the completed review.
                        -->

                        {% if album[0] in reviewed_album_ids %}

                            <a href="{{ url_for('ranking', album_id=album[0]) }}">
                                <img
                                    src="{{ album[3] }}"
                                    width="200"
                                >
                            </a>

                        {% else %}

                            <!--
                                If the album has not been reviewed,
                                clicking it opens the rating form.
                            -->

                            <a href="{{ url_for('album_review', album_id=album[0]) }}">
                                <img
                                    src="{{ album[3] }}"
                                    width="200"
                                >
                            </a>

                        {% endif %}

                    </div>

                {% endfor %}

            </div>

        {% else %}

            <!-- Message shown when the queue is empty -->
            <p class="no-review">Your queue is empty.</p>

        {% endif %}

    </div>

</body>

</html>
