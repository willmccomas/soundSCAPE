<!DOCTYPE html>
<html>

<head>
    <title>soundSCAPE</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =====================================================
         NAVIGATION BAR
         ===================================================== -->

    <nav>

        <!-- SoundScape logo -->
        <a href="/" class="logo">
            <span class="sound">sound</span><span class="scape">SCAPE</span>
        </a>

        <!-- Main navigation links -->
        <div class="nav-links">
            <a href="/all_rankings">Ratings</a>
            <a href="/queue">Queue</a>
            <a href="/search">Search</a>
        </div>

    </nav>


    <!-- =====================================================
         MAIN PAGE CONTENT
         ===================================================== -->

    <div class="page-container">

        <!-- Page heading -->
        <div class="home-header">

            <h1>Home</h1>

        </div>


        <!-- =================================================
             RECENTLY RATED ALBUMS
             Displays the user's most recently reviewed albums.
             ================================================= -->

        <div class="recent-ratings">

            <h2>Recently Rated</h2>

            {% for album in recent_reviews %}

                <!-- Individual album card -->
                <div
                    class="album-search-card"
                    style="background-image: url('{{ album[3] }}');"
                >

                    <!-- Album artwork links to the album's review -->
                    <a href="{{ url_for('ranking', album_id=album[0]) }}">
                        <img
                            src="{{ album[3] }}"
                            width="200"
                            alt="{{ album[1] }} album cover"
                        >
                    </a>


                    <!-- Album information -->
                    <div class="search-album-info">

                        <!-- Album title -->
                        <h2>{{ album[1] }}</h2>

                        <!-- Artist -->
                        <p>{{ album[2] }}</p>

                        <!-- Release date -->
                        <p>
                            Release Date: {{ format_release_date(album[4]) }}
                        </p>

                        <!-- User's rating -->
                        <div class="stars">
                            {{ star_rating(album[5]) }}
                        </div>

                        <!-- How long ago the album was reviewed -->
                        <h2>{{ days_ago(album[7]) }}</h2>

                    </div>

                </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
