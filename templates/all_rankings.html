<html>

<head>
    <title>All Rankings</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>


<body>

    <!-- Navigation bar -->
    <nav>

        <!-- SoundScape logo -->
        <a href="/" class="logo">
            <span class="sound">sound</span><span class="scape">SCAPE</span>
        </a>

        <!-- Main navigation links -->
        <div class="nav-links">
            <a href="/all_rankings">Ratings</a>
            <a href="/queue">Queue</a>
            <a href="/search">Search</a>
        </div>

    </nav>


    <!-- Main page content -->
    <div class="page-container">

        <!-- Page heading and sort button -->
        <div class="ratings-header">

            <h1>Ratings</h1>

            <!-- Sort dropdown -->
            <div class="sort-container">

                <button
                    type="button"
                    class="sort-button"
                    onclick="toggleSortMenu()"
                >
                    Sort ▾
                </button>


                <div
                    id="sort-menu"
                    class="sort-menu"
                >

                    <!-- Release date — newest first -->
                    <a
                        href="{{ url_for('all_rankings', sort='release_desc') }}"
                        class="{% if current_sort == 'release_desc' %}selected{% endif %}"
                    >
                        Release Date: Newest
                    </a>


                    <!-- Release date — oldest first -->
                    <a
                        href="{{ url_for('all_rankings', sort='release_asc') }}"
                        class="{% if current_sort == 'release_asc' %}selected{% endif %}"
                    >
                        Release Date: Oldest
                    </a>


                    <!-- Highest rated -->
                    <a
                        href="{{ url_for('all_rankings', sort='rating_desc') }}"
                        class="{% if current_sort == 'rating_desc' %}selected{% endif %}"
                    >
                        Highest Rated
                    </a>


                    <!-- Lowest rated -->
                    <a
                        href="{{ url_for('all_rankings', sort='rating_asc') }}"
                        class="{% if current_sort == 'rating_asc' %}selected{% endif %}"
                    >
                        Lowest Rated
                    </a>


                    <!-- Newest reviewed -->
                    <a
                        href="{{ url_for('all_rankings', sort='review_desc') }}"
                        class="{% if current_sort == 'review_desc' %}selected{% endif %}"
                    >
                        Review Date: Newest
                    </a>


                    <!-- Oldest reviewed -->
                    <a
                        href="{{ url_for('all_rankings', sort='review_asc') }}"
                        class="{% if current_sort == 'review_asc' %}selected{% endif %}"
                    >
                        Review Date: Oldest
                    </a>


                    <!-- Album name A-Z -->
                    <a
                        href="{{ url_for('all_rankings', sort='name_asc') }}"
                        class="{% if current_sort == 'name_asc' %}selected{% endif %}"
                    >
                        Album A–Z
                    </a>


                    <!-- Album name Z-A -->
                    <a
                        href="{{ url_for('all_rankings', sort='name_desc') }}"
                        class="{% if current_sort == 'name_desc' %}selected{% endif %}"
                    >
                        Album Z–A
                    </a>

                </div>

            </div>

        </div>


        <!-- Album grid -->
        <div class="album-grid">

            {% for album in albums %}

                <!-- Individual album -->
                <div class="album-card">

                    <!-- Album artwork links to the album's review -->
                    <a href="{{ url_for('ranking', album_id=album[0]) }}">
                        <img
                            src="{{ album[3] }}"
                            width="200"
                        >
                    </a>

                    <!-- Album's star rating -->
                    <h2 class="stars">
                        {{ star_rating(album[5]) }}
                    </h2>

                </div>

            {% endfor %}

        </div>

    </div>


    <!-- Sort menu JavaScript -->
    <script>

        function toggleSortMenu() {

            const menu = document.getElementById("sort-menu");

            menu.classList.toggle("show");

        }


        // Close the menu when clicking somewhere else
        window.addEventListener("click", function(event) {

            const sortContainer =
                document.querySelector(".sort-container");

            if (!sortContainer.contains(event.target)) {

                document
                    .getElementById("sort-menu")
                    .classList.remove("show");

            }

        });

    </script>

</body>

</html>
